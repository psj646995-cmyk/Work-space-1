/* Layout: one-screen app. Top bar, map on the left, station/notice panel on the right (bottom sheet on phones). */
:root{
  --bg:#F2F4F1; --panel:#FFFFFF; --ink:#16201C; --muted:#5B6862; --line:#DCE2DD; --chip:#EDF1EE;
  --accent:#0D6B5C; --accent-ink:#FFFFFF;
  --land:#EEF0EA; --road:#FFFFFF; --road-casing:#D5DAD2; --road-major:#F2D49B; --road-major-casing:#D9B46C;
  --water:#BCD5E2; --park:#D9E6CF; --aero:#E3E1EA; --label:#3E4A44; --label-halo:#F2F4EE;
  --ok:#1D8F4E; --deliv:#2463A8; --sched:#C9861A; --out:#BF2F2F; --unk:#AAB3AE; --pin-ink:#FFFFFF;
  --shadow:0 1px 2px rgba(20,30,25,.08),0 6px 24px rgba(20,30,25,.10);
  --f-text:"IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1412; --panel:#161D1A; --ink:#E4EBE7; --muted:#93A29B; --line:#28332E; --chip:#1F2824;
  --accent:#3FBFA3; --accent-ink:#06201A;
  --land:#18201C; --road:#2A3430; --road-casing:#1E2723; --road-major:#5E4C27; --road-major-casing:#3E321A;
  --water:#183241; --park:#1B2A1F; --aero:#22232B; --label:#B9C6BF; --label-halo:#18201C;
  --ok:#3DBA74; --deliv:#5B9BE6; --sched:#E3A43C; --out:#E5605A; --unk:#5C6862; --pin-ink:#0B110E;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 28px rgba(0,0,0,.45); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1412; --panel:#161D1A; --ink:#E4EBE7; --muted:#93A29B; --line:#28332E; --chip:#1F2824;
  --accent:#3FBFA3; --accent-ink:#06201A;
  --land:#18201C; --road:#2A3430; --road-casing:#1E2723; --road-major:#5E4C27; --road-major-casing:#3E321A;
  --water:#183241; --park:#1B2A1F; --aero:#22232B; --label:#B9C6BF; --label-halo:#18201C;
  --ok:#3DBA74; --deliv:#5B9BE6; --sched:#E3A43C; --out:#E5605A; --unk:#5C6862; --pin-ink:#0B110E;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 28px rgba(0,0,0,.45); color-scheme:dark}

[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-text);font-size:14px;line-height:1.5;overflow:hidden}
button{font:inherit;color:inherit}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{height:100%;display:grid;grid-template-rows:auto 1fr}

/* top bar */
.bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-block:10px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background:var(--panel);border-bottom:1px solid var(--line);position:relative;z-index:500}
.brand{display:flex;align-items:center;gap:10px;min-width:0;margin-right:auto}
.mark{width:30px;height:30px;border-radius:8px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex:none}
.brand h1{font-size:16px;font-weight:700;margin:0;letter-spacing:-.01em;white-space:nowrap}
.brand .sub{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg{display:inline-flex;background:var(--chip);border-radius:999px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:5px 12px;border-radius:999px;cursor:pointer;font-weight:500;font-size:13px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--panel);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.seg .dot{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px;vertical-align:1px;background:var(--muted)}

/* body */
.main{position:relative;display:grid;grid-template-columns:1fr 392px;min-height:0}
#map{position:relative;min-height:0;background:var(--land);z-index:1}
.leaflet-container{background:var(--land);font-family:var(--f-text)}
.leaflet-control-attribution{background:color-mix(in srgb,var(--panel) 85%,transparent)!important;color:var(--muted)!important;font-size:10px}
.leaflet-control-attribution a{color:var(--muted)!important}
.leaflet-bar a{background:var(--panel)!important;color:var(--ink)!important;border-color:var(--line)!important}
.leaflet-bar{border:1px solid var(--line)!important;box-shadow:var(--shadow)!important}

.panel{background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0;z-index:400}
.status-line{padding:14px 16px 12px;border-bottom:1px solid var(--line);display:grid;gap:4px}
.status-line .k{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.status-line .v{font-size:13px}
.status-line .when{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.tabs{display:flex;gap:4px;padding:10px 12px 0;border-bottom:1px solid var(--line)}
.tabs button{border:0;background:none;padding:8px 10px 10px;cursor:pointer;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tabs .count{font-family:var(--f-mono);font-size:11px;background:var(--chip);border-radius:999px;padding:1px 6px;margin-left:4px;color:var(--muted)}
.scroll{overflow:auto;min-height:0;flex:1}
.search{padding:10px 12px;position:sticky;top:0;background:var(--panel);z-index:2;border-bottom:1px solid var(--line)}
.search input{width:100%;box-sizing:border-box;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:8px 10px;font:inherit}
.areachips{display:flex;gap:6px;overflow-x:auto;padding:8px 0 2px;scrollbar-width:thin}
.areachips button{flex:none;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:3px 10px;font-size:12px;font-weight:500;cursor:pointer;white-space:nowrap}
.areachips button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.areachips button .n{font-family:var(--f-mono);font-size:11px;color:var(--muted);margin-left:4px}
.areachips button[aria-pressed="true"] .n{color:inherit;opacity:.8}
.areahead{padding:12px 16px 4px;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.areahead b{font-size:15px}
.areahead span{color:var(--muted);font-size:12px}
.st .dist{font-family:var(--f-mono);font-size:11px;color:var(--muted)}

.st{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:11px 16px;border-bottom:1px solid var(--line);cursor:pointer;background:none;border-left:0;border-right:0;border-top:0;width:100%;text-align:left}
.st:hover{background:var(--chip)}
.st[aria-current="true"]{background:color-mix(in srgb,var(--accent) 9%,var(--panel))}
.st .nm{font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.st .meta{grid-column:1;font-size:12px;color:var(--muted);min-width:0}
.st .cells{grid-row:1/span 2;grid-column:2;align-self:center;display:flex;gap:4px}
.section-h{padding:12px 16px 6px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}

.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;border-radius:6px;padding:2px 7px;background:var(--chip);color:var(--ink);white-space:nowrap}
.chip i{width:8px;height:8px;border-radius:50%;background:var(--c,var(--unk));flex:none}
.chip.stale{opacity:.55}
.mini{width:24px;height:22px;border-radius:5px;display:grid;place-items:center;font-size:11px;font-weight:700;color:var(--pin-ink);background:var(--c,var(--unk))}
.mini.stale{opacity:.45}

/* detail */
.detail{padding:14px 16px 18px;border-bottom:1px solid var(--line);display:grid;gap:12px;background:color-mix(in srgb,var(--accent) 5%,var(--panel))}
.detail h2{margin:0;font-size:17px;line-height:1.3;text-wrap:balance}
.detail .sub{color:var(--muted);font-size:12px}
.fuelrow{display:grid;grid-template-columns:64px 1fr;gap:4px 10px;align-items:start}
.fuelrow .fl{font-weight:600;font-size:13px;padding-top:2px}
.fuelrow .note{grid-column:2;font-size:13px;color:var(--ink)}
.fuelrow .src{grid-column:2;font-size:12px;color:var(--muted);font-family:var(--f-mono)}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:6px 11px;font-size:13px;font-weight:500;text-decoration:none;color:var(--ink);cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}

.notice{padding:13px 16px;border-bottom:1px solid var(--line);display:grid;gap:5px}
.notice .top{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tag{font-size:11px;font-weight:700;letter-spacing:.04em;border-radius:4px;padding:1px 6px;background:var(--chip);color:var(--muted)}
.tag.mera{background:color-mix(in srgb,var(--accent) 16%,var(--panel));color:var(--accent)}
.notice h3{margin:0;font-size:14px;line-height:1.35}
.notice p{margin:0;font-size:13px;color:var(--ink)}
.notice .when{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.notice .links{display:flex;gap:6px;flex-wrap:wrap}
.notice .links button{border:1px solid var(--line);background:none;border-radius:6px;padding:1px 7px;font-size:12px;cursor:pointer}
.foot{padding:14px 16px 24px;font-size:12px;color:var(--muted);display:grid;gap:6px}

/* legend */
.legend{position:absolute;left:max(12px,env(safe-area-inset-left,0px));bottom:26px;z-index:450;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:8px 10px;display:grid;gap:4px;font-size:12px}
.legend .row{display:flex;align-items:center;gap:7px}
.legend i{width:10px;height:10px;border-radius:3px;background:var(--c)}
.legend .hint{color:var(--muted);font-size:11px;border-top:1px solid var(--line);padding-top:4px;margin-top:2px}

/* pins */
.pin{display:flex;gap:2px;padding:2px;border-radius:7px;background:var(--panel);box-shadow:0 1px 3px rgba(0,0,0,.25);border:1px solid var(--line);transform:translate(-50%,-100%);position:absolute;left:0;top:0;white-space:nowrap}
.pin::after{content:"";position:absolute;left:50%;bottom:-5px;width:8px;height:8px;background:var(--panel);border-right:1px solid var(--line);border-bottom:1px solid var(--line);transform:translateX(-50%) rotate(45deg)}
.pin .c{width:18px;height:16px;border-radius:4px;display:grid;place-items:center;font-size:10px;font-weight:700;color:var(--pin-ink);background:var(--c,var(--unk));position:relative;z-index:1}
.pin .c.stale{opacity:.45}
.dotpin{position:absolute;left:0;top:0;width:10px;height:10px;border-radius:50%;background:var(--unk);border:2px solid var(--panel);box-shadow:0 0 0 1px var(--line);transform:translate(-50%,-50%);cursor:pointer}
.dotpin.sel{box-shadow:0 0 0 2px var(--accent);width:14px;height:14px}
.pin.sel{outline:2px solid var(--accent);outline-offset:1px;z-index:5}
.lbl{color:var(--label);font-size:11px;font-weight:500;white-space:nowrap;text-shadow:0 0 3px var(--label-halo),0 0 3px var(--label-halo),0 0 2px var(--label-halo);transform:translate(-50%,-50%);position:absolute;pointer-events:none}
.lbl.major{font-size:13px;font-weight:700;letter-spacing:.02em}
.lbl.poi{font-style:italic;font-size:10.5px}
.lbl.area{font-family:var(--f-mono);font-size:10.5px;opacity:.8}
.loading{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);z-index:300;pointer-events:none}

.sheet-handle{display:none}
@media (max-width:820px){
  .main{grid-template-columns:1fr}
  .panel{position:absolute;left:0;right:0;bottom:0;height:42%;border-left:0;border-top:1px solid var(--line);border-radius:14px 14px 0 0;box-shadow:var(--shadow);transition:height .25s ease;padding-bottom:env(safe-area-inset-bottom,0px)}
  .panel.full{height:88%}
  .panel.min{height:132px}
  .sheet-handle{display:flex;justify-content:center;padding:7px 0 0;border:0;background:none;cursor:pointer;width:100%}
  .sheet-handle span{width:40px;height:4px;border-radius:2px;background:var(--line)}
  .brand .sub{display:none}
  .bar{gap:8px 10px;flex-wrap:wrap}
  #fuelSeg{order:3;width:100%;box-sizing:border-box}
  #fuelSeg button{flex:1}
  .brand h1{font-size:15px}
  .mark{width:26px;height:26px}
  .legend{top:12px;bottom:auto!important;left:56px;right:max(12px,env(safe-area-inset-right,0px));display:flex;flex-wrap:wrap;gap:4px 10px;padding:6px 9px;font-size:11px}
  .legend .hint{display:none}
  .legend.hide{display:none}
}

@media (prefers-reduced-motion:reduce){.panel,.legend{transition:none}}

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script>
(() => {
const TZ = "Africa/Blantyre";
const T = {
  ko: {
    title: "릴롱궤 연료 지도", subtitle: "MERA 공지·현지 뉴스 기반 · 자동 업데이트",
    all: "전체", petrol: "휘발유", diesel: "경유", P: "휘", D: "경",
    loading: "지도를 불러오는 중…", lastCheck: "마지막 자동 확인", stations: "주유소", notices: "공지·소식",
    search: "주유소, 도로, 동네 검색 (예: area 3)", withInfo: "최근 정보가 있는 주유소", noInfo: "정보 없음",
    st_available: "판매 중", st_delivering: "하역 중", st_scheduled: "MERA 배송 예정", st_out: "품절", st_unknown: "정보 없음",
    stale: "24시간 넘은 정보는 흐리게 표시", staleTag: "오래됨",
    src_mera: "MERA 공지", src_news: "뉴스", src_company: "회사 공지", src_screenshot: "MERA 게시물 캡처",
    ago_m: n => `${n}분 전`, ago_h: n => `${n}시간 전`, ago_d: n => `${n}일 전`, now: "방금",
    original: "원문 보기", directions: "길찾기", close: "닫기", onMap: "지도에서 보기",
    tz: "말라위 시간", noNotices: "아직 공지가 없습니다.",
    emptyStations: "검색 결과가 없습니다.",
    areaCount: n => `주유소 ${n}곳`, areaNone: "이 동네 안에는 등록된 주유소가 없습니다.", nearby: "가까운 주유소 (1 km 이내)",
    noArea: a => `${a}는 릴롱궤 시의 동네 번호가 아닙니다 (Area 1–58).`, inArea: "이 동네 안",
    foot1: "자동 확인: 매일 06·09·12·15·18·21시 (말라위 시간). MERA 홈페이지, 현지 뉴스, 정유사 공지를 확인합니다.",
    foot2: "MERA 페이스북은 로그인 없이 자동으로 읽을 수 없습니다. 급한 공지는 캡처를 Claude에게 보내면 바로 반영됩니다.",
    fb: "MERA 페이스북 열기",
    foot3: "정보는 공지 기준이며 실제 재고와 다를 수 있습니다. 지도 © OpenStreetMap 기여자.",
    noData: "아직 이 주유소에 대한 공지나 소식이 없습니다."
  },
  en: {
    title: "Lilongwe Fuel Map", subtitle: "From MERA notices and local news · updated automatically",
    all: "All", petrol: "Petrol", diesel: "Diesel", P: "P", D: "D",
    loading: "Loading map…", lastCheck: "Last automatic check", stations: "Stations", notices: "Notices",
    search: "Search station, road or area (e.g. area 3)", withInfo: "Stations with recent info", noInfo: "No information",
    st_available: "Selling", st_delivering: "Offloading", st_scheduled: "MERA scheduled", st_out: "Out of stock", st_unknown: "No info",
    stale: "Info older than 24 h is faded", staleTag: "old",
    src_mera: "MERA notice", src_news: "News", src_company: "Company notice", src_screenshot: "MERA post screenshot",
    ago_m: n => `${n} min ago`, ago_h: n => `${n} h ago`, ago_d: n => `${n} d ago`, now: "just now",
    original: "Source", directions: "Directions", close: "Close", onMap: "Show on map",
    tz: "Malawi time", noNotices: "No notices yet.",
    emptyStations: "No stations match.",
    areaCount: n => `${n} station${n===1?"":"s"}`, areaNone: "No stations are registered inside this area.", nearby: "Nearby stations (within 1 km)",
    noArea: a => `${a} isn't a Lilongwe City area number (Area 1–58).`, inArea: "Inside this area",
    foot1: "Checked automatically at 06, 09, 12, 15, 18 and 21 h Malawi time: MERA website, local news and oil company notices.",
    foot2: "MERA's Facebook page can't be read automatically without a login. Send Claude a screenshot of an urgent post and it will be added right away.",
    fb: "Open MERA on Facebook",
    foot3: "Based on published notices; actual stock can differ. Map © OpenStreetMap contributors.",
    noData: "No notices or news about this station yet."
  }
};
const STATES = ["available","delivering","scheduled","out","unknown"];
const SCOLOR = {available:"--ok",delivering:"--deliv",scheduled:"--sched",out:"--out",unknown:"--unk"};
const STALE_H = 24, EXPIRE_H = 72;

const store = { get(k){ try{return localStorage.getItem(k)}catch(e){return null} }, set(k,v){ try{localStorage.setItem(k,v)}catch(e){} } };
let lang = store.get("lang") || ((navigator.language||"").toLowerCase().startsWith("ko") ? "ko" : "en");
if (!T[lang]) lang = "ko";
let fuel = store.get("fuel") || "all";
let data = null, selected = null, query = "", tab = "st";
const $ = id => document.getElementById(id);
const t = k => T[lang][k];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function css(name){ return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }
function hoursSince(iso){ return (Date.now() - new Date(iso).getTime()) / 36e5; }
function ago(iso){
  const m = Math.max(0, Math.round((Date.now() - new Date(iso).getTime())/6e4));
  if (m < 2) return t("now");
  if (m < 60) return t("ago_m")(m);
  const h = Math.round(m/60); if (h < 48) return t("ago_h")(h);
  return t("ago_d")(Math.round(h/24));
}
function fmt(iso){
  const d = new Date(iso);
  return new Intl.DateTimeFormat(lang === "ko" ? "ko-KR" : "en-GB", {timeZone: TZ, month: lang==="ko"?"long":"short", day:"numeric", hour:"2-digit", minute:"2-digit", hour12:false}).format(d);
}
// effective state of one fuel at one station
function fuelInfo(sid, f){
  const e = data?.status?.[sid]?.[f];
  if (!e) return {state:"unknown"};
  const h = hoursSince(e.at);
  if (h > EXPIRE_H) return {...e, state:"unknown", expired:true, was:e.state};
  return {...e, stale: h > STALE_H};
}
function fuelsShown(){ return fuel === "all" ? ["petrol","diesel"] : [fuel]; }
function latestAt(sid){
  const s = data?.status?.[sid]; if (!s) return 0;
  return Math.max(0, ...fuelsShown().map(f => { const i = fuelInfo(sid,f); return i.state !== "unknown" ? new Date(i.at).getTime() : 0; }));
}

/* ---------- map ---------- */
const map = L.map("map", {zoomControl:true, attributionControl:true, minZoom:11, maxZoom:17, preferCanvas:true,
  maxBounds:[[-14.25,33.5],[-13.7,34.0]], maxBoundsViscosity:.8}).setView([-13.968,33.775], 13);
map.attributionControl.setPrefix(false);
const renderer = L.canvas({padding:.3});
const base = {}; let labelLayer = L.layerGroup().addTo(map), pinLayer = L.layerGroup().addTo(map);
const markers = {};

function styleBase(){
  if (!base.built) return;
  base.water.setStyle({fillColor:css("--water"), color:css("--water")});
  base.rivers.setStyle({color:css("--water")});
  base.parks.setStyle({fillColor:css("--park"), color:css("--park")});
  base.aero.setStyle({fillColor:css("--aero"), color:css("--aero")});
  base.minor.setStyle({color:css("--road")});
  base.minorCase.setStyle({color:css("--road-casing")});
  for (const k of ["tertiary","secondary","primary","trunk"]) {
    base[k].setStyle({color: k==="tertiary" ? css("--road") : css("--road-major")});
    base[k+"Case"].setStyle({color: k==="tertiary" ? css("--road-casing") : css("--road-major-casing")});
  }
  map.getContainer().style.background = css("--land");
}
function ll(cs){ return cs.map(p => [p[1], p[0]]); }
function buildBase(bm){
  const poly = (arr) => L.polygon(arr.map(rings => rings.map(ll)), {renderer, stroke:false, fillOpacity:1, interactive:false});
  base.parks = poly(bm.parks).addTo(map);
  base.aero = poly(bm.aero).addTo(map);
  base.water = poly(bm.water).addTo(map);
  base.rivers = L.polyline(bm.rivers.map(ll), {renderer, weight:1.2, interactive:false}).addTo(map);
  const W = {minor:[1.6,2.6], tertiary:[2.6,4], secondary:[3.4,5], primary:[4,5.8], trunk:[4.6,6.4]};
  base.minorCase = L.polyline(bm.roads.minor.map(ll), {renderer, weight:W.minor[1], interactive:false, lineCap:"round"});
  base.minor = L.polyline(bm.roads.minor.map(ll), {renderer, weight:W.minor[0], interactive:false, lineCap:"round"});
  for (const k of ["tertiary","secondary","primary","trunk"]) {
    base[k+"Case"] = L.polyline((bm.roads[k]||[]).map(ll), {renderer, weight:W[k][1], interactive:false, lineCap:"round"}).addTo(map);
  }
  for (const k of ["tertiary","secondary","primary","trunk"]) {
    base[k] = L.polyline((bm.roads[k]||[]).map(ll), {renderer, weight:W[k][0], interactive:false, lineCap:"round"}).addTo(map);
  }
  base.labels = bm.labels;
  base.built = true;
  map.attributionControl.addAttribution(esc(bm.attribution));
  zoomLayers(); styleBase(); drawLabels();
}
function zoomLayers(){
  if (!base.built) return;
  const z = map.getZoom(), show = z >= 14;
  for (const l of [base.minorCase, base.minor]) { if (show && !map.hasLayer(l)) l.addTo(map); if (!show && map.hasLayer(l)) map.removeLayer(l); }
  if (show) { base.minorCase.bringToBack(); base.minor.bringToFront(); for (const k of ["tertiaryCase","secondaryCase","primaryCase","trunkCase","tertiary","secondary","primary","trunk"]) base[k].bringToFront(); }
  base.parks.bringToBack(); base.water.bringToBack();
  drawLabels();
}
function drawLabels(){
  if (!base.labels) return;
  labelLayer.clearLayers();
  const z = map.getZoom();
  for (const l of base.labels) {
    if (l.k === "area") continue; // Area labels come from the official boundaries in data.json
    if (l.k === "poi" && z < 14) continue;
    const icon = L.divIcon({className:"", iconSize:null, html:`<div class="lbl ${l.k}">${esc(l[lang])}</div>`});
    L.marker([l.p[1], l.p[0]], {icon, interactive:false, keyboard:false}).addTo(labelLayer);
  }
  if (data?.areas && z >= 14) for (const a of data.areas) {
    const icon = L.divIcon({className:"", iconSize:null, html:`<div class="lbl area">${esc(a.n)}</div>`});
    L.marker([a.c[1], a.c[0]], {icon, interactive:false, keyboard:false}).addTo(labelLayer);
  }
}
/* ---------- areas ---------- */
let areaLayer = null, areaHL = null, shownArea = null;
function parseArea(q){
  const m = q.trim().toLowerCase().replace(/\s+/g, " ").match(/^(?:area|에어리어|에리어|구역|a)?\s*[-#.]?\s*0*(\d{1,3})\s*(?:구역|번)?$/);
  return m ? +m[1] : null;
}
function areaByNum(n){ return data?.areas?.find(a => a.n === "Area " + n) || null; }
function segM(px, py, ax, ay, bx, by){
  const k = 108000, kk = 110600; px*=k; ax*=k; bx*=k; py*=kk; ay*=kk; by*=kk;
  const dx = bx-ax, dy = by-ay, tt = (dx||dy) ? Math.max(0, Math.min(1, ((px-ax)*dx + (py-ay)*dy)/(dx*dx+dy*dy))) : 0;
  return Math.hypot(px-ax-tt*dx, py-ay-tt*dy);
}
function distToArea(s, a){
  let best = Infinity;
  for (const r of a.rings) for (let i = 1; i < r.length; i++) best = Math.min(best, segM(s.lon, s.lat, r[i-1][0], r[i-1][1], r[i][0], r[i][1]));
  return best;
}
function drawAreaOutlines(){
  if (areaLayer || !data?.areas) return;
  areaLayer = L.polygon(data.areas.map(a => a.rings.map(ll)), {renderer, fill:false, weight:1, dashArray:"3 4", interactive:false}).addTo(map);
  styleAreas();
}
function styleAreas(){
  if (areaLayer) areaLayer.setStyle({color: css("--muted"), opacity:.45});
  if (areaHL) areaHL.setStyle({color: css("--accent"), fillColor: css("--accent")});
}
function showArea(a){
  if (shownArea === (a && a.n)) return;
  shownArea = a ? a.n : null;
  if (areaHL) { map.removeLayer(areaHL); areaHL = null; }
  if (!a) return;
  areaHL = L.polygon(a.rings.map(ll), {renderer, weight:2.5, fillOpacity:.1, interactive:false}).addTo(map);
  styleAreas();
  const sheet = isPhone() ? $("panel").getBoundingClientRect().height : 0;
  map.flyToBounds(areaHL.getBounds(), {paddingTopLeft:[24, isPhone() ? 70 : 40], paddingBottomRight:[24, sheet + 24], maxZoom:16, duration: matchMedia("(prefers-reduced-motion: reduce)").matches ? 0 : .6});
}
function renderAreaChips(){
  if (!data?.areas) return;
  const counts = {};
  for (const s of data.stations) if (s.area) counts[s.area] = (counts[s.area]||0) + 1;
  const cur = parseArea(query);
  $("areachips").innerHTML = data.areas.filter(a => counts[a.n]).map(a =>
    `<button data-area="${esc(a.n)}" aria-pressed="${cur !== null && a.n === "Area " + cur}">${esc(a.n)}<span class="n">${counts[a.n]}</span></button>`).join("");
}
map.on("zoomend", zoomLayers);

function pinHTML(s){
  const fs = fuelsShown();
  const infos = fs.map(f => [f, fuelInfo(s.id, f)]);
  const quiet = infos.every(([,i]) => i.state === "unknown");
  if (quiet) return `<div class="dotpin${selected===s.id?" sel":""}"></div>`;
  const cells = infos.map(([f,i]) => `<span class="c${i.stale?" stale":""}" style="--c:var(${SCOLOR[i.state]})">${t(f==="petrol"?"P":"D")}</span>`).join("");
  return `<div class="pin${selected===s.id?" sel":""}">${cells}</div>`;
}
function drawPins(){
  pinLayer.clearLayers();
  for (const s of data.stations) {
    const icon = L.divIcon({className:"", iconSize:null, html: pinHTML(s)});
    const m = L.marker([s.lat, s.lon], {icon, title: s.name, riseOnHover:true, zIndexOffset: latestAt(s.id) ? 1000 : 0, keyboard:true});
    m.on("click", () => select(s.id, false));
    m.addTo(pinLayer); markers[s.id] = m;
  }
}

/* ---------- panel ---------- */
function chip(state, stale, extra=""){
  return `<span class="chip${stale?" stale":""}" style="--c:var(${SCOLOR[state]})"><i></i>${t("st_"+state)}${extra}</span>`;
}
function stationRow(s){
  const fs = fuelsShown();
  const cells = fs.map(f => { const i = fuelInfo(s.id,f); return `<span class="mini${i.stale?" stale":""}" style="--c:var(${SCOLOR[i.state]})" title="${esc(t(f)+": "+t("st_"+i.state))}">${t(f==="petrol"?"P":"D")}</span>`; }).join("");
  const la = latestAt(s.id);
  const place = [s.area, s.road].filter(Boolean).join(" · ");
  const meta = la ? `${ago(new Date(la).toISOString())} · ${esc(place || s.brand || "")}` : esc(place || s.brand || t("noInfo"));
  const dist = s._d != null ? ` <span class="dist">${s._d < 100 ? "&lt;0.1" : (s._d/1000).toFixed(1)} km</span>` : "";
  return `<button class="st" data-id="${esc(s.id)}" aria-current="${selected===s.id}"><span class="nm">${esc(s.name)}</span><span class="meta">${meta}${dist}</span><span class="cells">${cells}</span></button>`;
}
function renderAreaList(n){
  const a = areaByNum(n);
  showArea(a);
  if (!a) { $("list").innerHTML = `<div class="foot">${esc(t("noArea")("Area " + n))}</div>`; return; }
  const byInfo = (x, y) => (latestAt(y.id) - latestAt(x.id)) || x.name.localeCompare(y.name);
  const inside = data.stations.filter(s => s.area === a.n).map(s => ({...s, _d:null})).sort(byInfo);
  const near = data.stations.filter(s => s.area !== a.n).map(s => ({...s, _d: distToArea(s, a)})).filter(s => s._d <= 1000).sort((x, y) => x._d - y._d);
  let h = `<div class="areahead"><b>${esc(a.n)}</b><span>${esc(t("areaCount")(inside.length))}</span></div>`;
  h += inside.length ? inside.map(stationRow).join("") : `<div class="foot">${t("areaNone")}</div>`;
  if (near.length) h += `<div class="section-h">${t("nearby")}</div>` + near.map(stationRow).join("");
  $("list").innerHTML = h;
}
function renderList(){
  renderAreaChips();
  const an = parseArea(query);
  if (an !== null && data.areas) return renderAreaList(an);
  showArea(null);
  const q = query.trim().toLowerCase();
  const match = s => !q || [s.name, s.brand, s.road, s.area, ...(s.aliases||[])].some(x => (x||"").toLowerCase().includes(q));
  const rows = data.stations.filter(match);
  const withInfo = rows.filter(s => latestAt(s.id)).sort((a,b) => latestAt(b.id) - latestAt(a.id));
  const rest = rows.filter(s => !latestAt(s.id)).sort((a,b) => a.name.localeCompare(b.name));
  let h = "";
  if (withInfo.length) h += `<div class="section-h">${t("withInfo")}</div>` + withInfo.map(stationRow).join("");
  if (rest.length) h += `<div class="section-h">${t("noInfo")}</div>` + rest.map(stationRow).join("");
  if (!rows.length) h = `<div class="foot">${t("emptyStations")}</div>`;
  $("list").innerHTML = h;
  $("cnt-st").textContent = withInfo.length ? `${withInfo.length}/${data.stations.length}` : data.stations.length;
}
function renderDetail(){
  const s = data.stations.find(x => x.id === selected);
  if (!s) { $("detail").innerHTML = ""; return; }
  const rows = ["petrol","diesel"].map(f => {
    const i = fuelInfo(s.id, f);
    if (i.state === "unknown" && !i.expired) return `<div class="fuelrow"><div class="fl">${t(f)}</div><div>${chip("unknown")}</div></div>`;
    const shown = i.expired ? i.was : i.state;
    const note = i.note ? `<div class="note">${esc(i.note[lang])}</div>` : "";
    const src = `<div class="src">${esc(t("src_"+i.source))} · ${esc(fmt(i.at))} · ${esc(ago(i.at))}${i.url ? ` · <a href="${esc(i.url)}" target="_blank" rel="noopener">${t("original")} ↗</a>` : ""}</div>`;
    return `<div class="fuelrow"><div class="fl">${t(f)}</div><div>${chip(shown, i.stale || i.expired, (i.stale||i.expired) ? ` · ${t("staleTag")}` : "")}</div>${note}${src}</div>`;
  }).join("");
  const has = ["petrol","diesel"].some(f => data.status?.[s.id]?.[f]);
  $("detail").innerHTML = `<div class="detail">
    <div><h2>${esc(s.name)}</h2><div class="sub">${esc([s.brand, s.area, s.road].filter(Boolean).join(" · "))}</div></div>
    ${rows}
    ${has ? "" : `<div class="sub">${t("noData")}</div>`}
    <div class="actions">
      <a class="btn primary" target="_blank" rel="noopener" href="https://www.google.com/maps/dir/?api=1&destination=${s.lat},${s.lon}">${t("directions")} ↗</a>
      <button class="btn" id="closeDetail">${t("close")}</button>
    </div></div>`;
  $("closeDetail").onclick = () => select(null);
}
function renderNotices(){
  const ns = data.notices || [];
  $("cnt-no").textContent = ns.length;
  if (!ns.length) { $("view-no").innerHTML = `<div class="foot">${t("noNotices")}</div>`; return; }
  $("view-no").innerHTML = ns.map(n => {
    const sts = (n.stations||[]).map(id => data.stations.find(s => s.id === id)).filter(Boolean);
    return `<article class="notice">
      <div class="top"><span class="tag ${n.source==="mera"?"mera":""}">${esc(t("src_"+n.source))}</span><span class="when">${esc(fmt(n.at))} · ${esc(ago(n.at))}</span></div>
      <h3>${esc(n.title[lang])}</h3>
      <p>${esc(n.summary[lang])}</p>
      ${sts.length ? `<div class="links">${sts.map(s => `<button data-go="${esc(s.id)}">${esc(s.name)}</button>`).join("")}</div>` : ""}
      ${n.url ? `<div><a href="${esc(n.url)}" target="_blank" rel="noopener">${t("original")} ↗</a></div>` : ""}
    </article>`;
  }).join("");
}
function renderLegend(){
  $("legend").innerHTML = STATES.map(s => `<div class="row"><i style="--c:var(${SCOLOR[s]})"></i>${t("st_"+s)}</div>`).join("") + `<div class="hint">${t("stale")}</div>`;
}
function renderStatic(){
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-t]").forEach(el => el.textContent = t(el.dataset.t));
  $("q").placeholder = t("search");
  for (const b of document.querySelectorAll("[data-lang]")) b.setAttribute("aria-pressed", b.dataset.lang === lang);
  for (const b of document.querySelectorAll("[data-fuel]")) b.setAttribute("aria-pressed", b.dataset.fuel === fuel);
  const fb = data?.meta?.mera_fb || "https://www.facebook.com/MERAMalawi";
  $("foot").innerHTML = `<div>${t("foot1")}</div><div>${t("foot2")} <a href="${esc(fb)}" target="_blank" rel="noopener">${t("fb")} ↗</a></div><div>${t("foot3")}</div>`;
  renderLegend();
}
function renderAll(){
  renderStatic();
  if (!data) return;
  $("lastResult").textContent = data.meta.lastResult[lang];
  $("lastWhen").textContent = `${fmt(data.meta.lastCheck)} (${t("tz")}) · ${ago(data.meta.lastCheck)}`;
  drawAreaOutlines();
  renderList(); renderDetail(); renderNotices(); drawPins(); drawLabels();
}
function select(id, fly=true){
  selected = id;
  if (tab !== "st") setTab("st");
  renderList(); renderDetail(); drawPins();
  if (id) {
    const s = data.stations.find(x => x.id === id);
    if (fly && s) map.flyTo([s.lat, s.lon], Math.max(map.getZoom(), 15), {duration: matchMedia("(prefers-reduced-motion: reduce)").matches ? 0 : .6});
    $("scroll").scrollTop = 0;
    if (isPhone() && $("panel").classList.contains("min")) setSheet("");
  }
}
function setTab(v){
  tab = v;
  $("tab-st").setAttribute("aria-selected", v === "st"); $("tab-no").setAttribute("aria-selected", v === "no");
  $("view-st").hidden = v !== "st"; $("view-no").hidden = v !== "no";
}
const isPhone = () => matchMedia("(max-width:820px)").matches;
function setSheet(mode){
  const p = $("panel"); p.classList.remove("full","min"); if (mode) p.classList.add(mode);
  $("legend").classList.toggle("min", mode === "min"); $("legend").classList.toggle("hide", mode === "full");
  setTimeout(() => map.invalidateSize(), 300);
}

/* ---------- events ---------- */
document.addEventListener("click", e => {
  const st = e.target.closest(".st"); if (st) return select(st.dataset.id);
  const go = e.target.closest("[data-go]"); if (go) return select(go.dataset.go);
  const ab = e.target.closest("[data-area]"); if (ab) { const same = parseArea(query) !== null && "Area " + parseArea(query) === ab.dataset.area; query = same ? "" : ab.dataset.area; $("q").value = query; selected = null; renderDetail(); drawPins(); return renderList(); }
  const lb = e.target.closest("[data-lang]"); if (lb) { lang = lb.dataset.lang; store.set("lang", lang); return renderAll(); }
  const fb = e.target.closest("[data-fuel]"); if (fb) { fuel = fb.dataset.fuel; store.set("fuel", fuel); return renderAll(); }
});
$("tab-st").onclick = () => setTab("st");
$("tab-no").onclick = () => setTab("no");
$("q").addEventListener("input", e => { query = e.target.value; renderList(); });
$("handle").onclick = () => { const p = $("panel"); setSheet(p.classList.contains("full") ? "min" : p.classList.contains("min") ? "" : "full"); };
const restyle = () => { styleBase(); styleAreas(); };
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", restyle);
new MutationObserver(restyle).observe(document.documentElement, {attributes:true, attributeFilter:["data-theme"]});
setInterval(() => { if (data) { renderList(); $("lastWhen").textContent = `${fmt(data.meta.lastCheck)} (${t("tz")}) · ${ago(data.meta.lastCheck)}`; } }, 60000);

renderStatic();
fetch("basemap.json").then(r => r.json()).then(buildBase).catch(() => {}).finally(() => { $("loading").hidden = true; });
fetch("data.json", {cache:"no-store"}).then(r => r.json()).then(d => { data = d; renderAll(); }).catch(() => {
  $("lastResult").textContent = lang === "ko" ? "데이터를 불러오지 못했습니다. 새로고침해 보세요." : "Couldn't load the data. Try reloading.";
});
})();
</script>
